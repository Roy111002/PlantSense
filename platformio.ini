[platformio]
src_dir = src

[env:esp32cam]
platform = espressif32 @ 7.0.1
board = esp32cam
framework = arduino
monitor_speed = 115200

lib_deps =
    blynkkk/Blynk @ 1.3.5
    bblanchon/ArduinoJson @ 6.21.5
    adafruit/DHT sensor library @ 1.4.6
    claws/BH1750 @ 1.3.0
    adafruit/Adafruit ADS1X15 @ 2.5.0
